<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How Better Compact works</title>
  <desc id="desc">Four steps: inspect context, prune stale content, summarize selected assistant runs, and preserve raw history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#15142A"/>
      <stop offset="1" stop-color="#0B1724"/>
    </linearGradient>
    <linearGradient id="line" x1="98" y1="0" x2="1102" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="#64748B" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M162 104H1038" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(50 54)" filter="url(#shadow)">
      <rect width="238" height="214" rx="18" fill="#111827" stroke="#A855F7" stroke-opacity="0.55"/>
      <circle cx="119" cy="50" r="30" fill="#2E2150"/>
      <circle cx="112" cy="45" r="12" stroke="#D8B4FE" stroke-width="3"/>
      <path d="M121 54L132 65" stroke="#D8B4FE" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="106" fill="#F8FAFC" font-size="21" font-weight="720">1. Inspect</text>
      <text x="24" y="136" fill="#94A3B8" font-size="14">Estimate the real request.</text>
      <text x="24" y="160" fill="#94A3B8" font-size="14">Find a safe raw tail.</text>
      <text x="24" y="184" fill="#94A3B8" font-size="14">Validate any stored plan.</text>
    </g>

    <g transform="translate(337 54)" filter="url(#shadow)">
      <rect width="238" height="214" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.58"/>
      <circle cx="119" cy="50" r="30" fill="#242A52"/>
      <path d="M100 43H138M105 51H133M111 59H127" stroke="#C7D2FE" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="106" fill="#F8FAFC" font-size="21" font-weight="720">2. Prune</text>
      <text x="24" y="136" fill="#94A3B8" font-size="14">Stub old tool traffic.</text>
      <text x="24" y="160" fill="#94A3B8" font-size="14">Remove stale reasoning.</text>
      <text x="24" y="184" fill="#94A3B8" font-size="14">Stop when the target fits.</text>
    </g>

    <g transform="translate(624 54)" filter="url(#shadow)">
      <rect width="238" height="214" rx="18" fill="#111827" stroke="#6366F1" stroke-opacity="0.62"/>
      <circle cx="119" cy="50" r="30" fill="#202B50"/>
      <path d="M103 39H135V61H114L104 69V61H103V39Z" stroke="#A5B4FC" stroke-width="3" stroke-linejoin="round"/>
      <text x="24" y="106" fill="#F8FAFC" font-size="21" font-weight="720">3. Summarize</text>
      <text x="24" y="136" fill="#94A3B8" font-size="14">Collapse selected runs.</text>
      <text x="24" y="160" fill="#94A3B8" font-size="14">Use a side model only here.</text>
      <text x="24" y="184" fill="#94A3B8" font-size="14">Reuse accepted summaries.</text>
    </g>

    <g transform="translate(911 54)" filter="url(#shadow)">
      <rect width="238" height="214" rx="18" fill="#111827" stroke="#22D3EE" stroke-opacity="0.65"/>
      <circle cx="119" cy="50" r="30" fill="#143849"/>
      <path d="M105 34H129L138 43V68H105V34Z" stroke="#A5F3FC" stroke-width="3" stroke-linejoin="round"/>
      <path d="M128 35V44H137M111 51H132M111 58H128" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round"/>
      <text x="24" y="106" fill="#F8FAFC" font-size="21" font-weight="720">4. Preserve</text>
      <text x="24" y="136" fill="#94A3B8" font-size="14">Write raw history to disk.</text>
      <text x="24" y="160" fill="#94A3B8" font-size="14">Insert a readable reference.</text>
      <text x="24" y="184" fill="#94A3B8" font-size="14">Replay the same stable plan.</text>
    </g>
  </g>
</svg>
